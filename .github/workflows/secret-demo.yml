name: secret-demo
'on': workflow_dispatch
jobs:
  secret-demo:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
      APP_ENV: ${{ vars.APP_ENV }}
    steps:
      - run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "secret absent"; exit 1
          fi
      - run: echo "longueur : ${#DEMO_TOKEN}"
      - run: echo "valeur : $DEMO_TOKEN"
      - run: echo "Environnement : $APP_ENV"
      

