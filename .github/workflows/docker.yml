name: docker
on:
  push:
    branches: 
      - main
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.vars.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      packages: read
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker run -d -p 8000:8000 --name tasks-api --rm $IMAGE:sha-${GITHUB_SHA::7}
      - run: |
          for i in $(seq 1 10); do
            curl -fs http://localhost:8000/health && break
            sleep 2
          done
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/version

  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          VERSION: ${{ needs.build.outputs.release_tag }}
        run: docker run -d -p 8000:8000 --name tasks-api --rm $IMAGE:${GITHUB_REF_NAME#v}
      - run: |
          for i in $(seq 1 10); do
            curl -fs http://localhost:8000/health && break
            sleep 2
          done
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/version

  update-config:
    needs: deploy-productions
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/tasks-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: k8s
      - name: Mettre à jour la version
        run: bash scripts/set-image-tag.sh k8s/deployment.yaml "$VERSION"
      - name: Commiter et pousser
        working-directory: k8s
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add deployment.yaml
          if git diff --cached --quiet; then
            echo "Aucun changement : la version $VERSION est déjà déployée."
            exit 0
          fi
          git commit -m "Déploie $VERSION"
          git push